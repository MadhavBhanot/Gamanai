# Local Postgres with pgvector (used from Phase 3 on). Run the API itself with `npm run dev`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gaminai
      POSTGRES_PASSWORD: gaminai
      POSTGRES_DB: gaminai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
