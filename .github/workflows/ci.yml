name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # File names only, so a hit never prints the key into the build log
      - name: No API keys in tracked files
        run: |
          if git grep -lIE 'jina_[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|tvly-[A-Za-z0-9-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}'; then
            echo "::error::Possible API key in the files above; move it to an environment variable"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Gaminai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/Gaminai/package-lock.json
      # Not `npm ci`: the lockfile is made on Windows and lacks Linux-only optional deps (@emnapi/*); Vercel uses install too
      - run: npm install --no-audit --no-fund
      - run: npm run build
